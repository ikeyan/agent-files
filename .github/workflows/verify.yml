name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # agent-sync の描画の検査 (scripts/test-agent-sync.sh) に要る archetect と bwrap。
      # ubuntu 24.04 は AppArmor で非特権の user namespace を制限し、bwrap が namespace を作れないので、使い捨ての runner で制限を外す。
      - run: |
          curl -fsSLo "$RUNNER_TEMP/archetect.tar.gz" https://github.com/archetect/archetect/releases/download/v3.6.1/archetect-v3.6.1-linux-x86_64.tar.gz
          echo "fdaf8cf524c8f4e20453607b5e5ea780966b7d144145896dc383067266349cfb  $RUNNER_TEMP/archetect.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/archetect.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/archetect-v3.6.1-linux-x86_64/archetect" /usr/local/bin/archetect
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # .git/hooks は checkout に入らない。verify.sh が写すのと同じ写しを置いてから、直さないモードで検査する。
      - run: hooks=$(git rev-parse --path-format=absolute --git-common-dir)/hooks && mkdir -p "$hooks" && install -m 755 hooks/pre-push "$hooks/pre-push"
      - run: ./verify.sh
        env:
          # CI は作業ツリーを直さない。symlink のずれは違反として落とす。
          VERIFY_READONLY: "1"

name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # clone の設定は checkout に入らない。開発者の clone と同じに揃えてから検査する。
      - run: git config core.hooksPath hooks
      - run: ./verify.sh
        env:
          # CI は作業ツリーを直さない。symlink のずれは違反として落とす。
          VERIFY_READONLY: "1"

name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # agent-sync の描画の検査 (scripts/test-agent-sync.sh) に要る archetect と bwrap。
      # ubuntu 24.04 は AppArmor で非特権の user namespace を制限し、bwrap が namespace を作れないので、使い捨ての runner で制限を外す。
      # 外せる条件: ubuntu-latest が、この sysctl の行を消しても scripts/test-agent-sync.sh の bwrap で通るようになったとき (runner の AppArmor の設定が変わるか、bwrap の profile が入る)。
      - run: |
          curl -fsSLo "$RUNNER_TEMP/archetect.tar.gz" https://github.com/archetect/archetect/releases/download/v3.6.1/archetect-v3.6.1-linux-x86_64.tar.gz
          echo "fdaf8cf524c8f4e20453607b5e5ea780966b7d144145896dc383067266349cfb  $RUNNER_TEMP/archetect.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/archetect.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/archetect-v3.6.1-linux-x86_64/archetect" /usr/local/bin/archetect
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # runner image 同梱の shellcheck (ubuntu-24.04 は 0.9.0) は SC2015 などの出方が手元と違うので、verify.sh が要求する版を /usr/local/bin に入れて先に引かせる。
      - run: |
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      # .git/hooks は checkout に入らない。verify.sh が写すのと同じ写しを置いてから、直さないモードで検査する。
      - run: hooks=$(git rev-parse --path-format=absolute --git-common-dir)/hooks && mkdir -p "$hooks" && install -m 755 hooks/pre-push "$hooks/pre-push"
      - run: ./verify.sh
        env:
          # CI は作業ツリーを直さない。symlink のずれは違反として落とす。
          VERIFY_READONLY: "1"
